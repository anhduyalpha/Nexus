<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS SATELLITE HUD | Xiaomi AI Node</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --cyan-glow: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.2);
            --cyan-bright: #38bdf8;
            --accent-purple: #818cf8;
            --accent-red: #f43f5e;
            --accent-green: #10b981;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: 1px solid rgba(0, 240, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 1rem;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(0, 240, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 85%, rgba(129, 140, 248, 0.1) 0%, transparent 60%);
        }

        /* Top Header */
        .header {
            text-align: center;
            width: 100%;
            max-width: 480px;
        }

        .badge-node {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--cyan-dim);
            border: var(--border-glow);
            padding: 6px 14px;
            border-radius: 999px;
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            color: var(--cyan-glow);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        .node-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-top: 10px;
            background: linear-gradient(135deg, #ffffff 20%, var(--cyan-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .node-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Center Arc Reactor / VU Meter */
        .reactor-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem 0;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed rgba(0, 240, 255, 0.3);
            animation: rotate-slow 20s linear infinite;
        }

        .middle-ring {
            position: absolute;
            width: 82%;
            height: 82%;
            border-radius: 50%;
            border: 1px solid rgba(129, 140, 248, 0.4);
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.15);
        }

        .core-pulse {
            position: absolute;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.5) 0%, rgba(0, 240, 255, 0.1) 70%, transparent 100%);
            transition: transform 0.05s ease, filter 0.05s ease;
            filter: drop-shadow(0 0 20px var(--cyan-glow));
        }

        .reactor-center {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .mic-icon-svg {
            width: 44px;
            height: 44px;
            fill: var(--cyan-glow);
            filter: drop-shadow(0 0 10px var(--cyan-glow));
            transition: transform 0.2s ease;
        }

        .reactor-status-text {
            font-family: 'Orbitron', monospace;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--cyan-bright);
            margin-top: 8px;
            text-transform: uppercase;
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Gain Boost Slider */
        .gain-slider-box {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .gain-slider {
            flex: 1;
            accent-color: var(--cyan-glow);
            cursor: pointer;
        }

        /* Live Response / Transcript Card */
        .transcript-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: var(--border-glow);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            backdrop-filter: blur(12px);
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .transcript-label {
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            color: var(--cyan-glow);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .transcript-content {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.4;
            font-weight: 500;
        }

        /* Controls / Action Buttons */
        .controls-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 0.8rem;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            outline: none;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f0ff 0%, #0284c7 100%);
            color: #030712;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.97);
            filter: brightness(1.2);
        }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.7);
            border: var(--border-glow);
            color: var(--cyan-bright);
        }

        .btn-secondary:active {
            transform: scale(0.97);
            background: var(--cyan-dim);
        }

        .btn-recording {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%) !important;
            color: #ffffff !important;
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.6) !important;
            animation: pulse-rec 1s infinite alternate;
        }

        @keyframes pulse-rec {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        /* Metrics Footer */
        .footer-metrics {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 10px;
            padding: 0 4px;
        }

        .metric-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="badge-node">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusLabel">DISCONNECTED</span>
        </div>
        <h1 class="node-title">XIAOMI AI MIC NODE</h1>
        <p class="node-subtitle">Hardware Direct Mic Uplink &bull; Zero Speaker Echo</p>
    </div>

    <!-- Center Arc Reactor VU Meter -->
    <div class="reactor-container">
        <div class="outer-ring"></div>
        <div class="middle-ring"></div>
        <div class="core-pulse" id="corePulse"></div>
        <div class="reactor-center">
            <svg class="mic-icon-svg" id="micIcon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <div class="reactor-status-text" id="reactorStatus">CHƯA BẬT MIC</div>
        </div>
    </div>

    <!-- Gain Boost Slider -->
    <div class="gain-slider-box">
        <span>🚀 KHUẾCH ĐẠI MIC:</span>
        <input type="range" class="gain-slider" id="gainSlider" min="1" max="25" value="10">
        <span id="gainValue" style="color: var(--cyan-glow); font-weight: bold; width: 35px;">10x</span>
    </div>

    <!-- Live Response / Transcript Card -->
    <div class="transcript-card">
        <div class="transcript-label" id="transcriptLabel">TRẠNG THÁI HỆ THỐNG</div>
        <div class="transcript-content" id="transcriptContent">Chạm nút bên dưới để bật Microphone và bắt đầu truyền âm thanh.</div>
    </div>

    <!-- Controls -->
    <div class="controls-container">
        <button class="btn-action btn-primary" id="btnToggleMic">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
            </svg>
            <span id="btnToggleText">BẬT MICROPHONE (ACTIVATE)</span>
        </button>

        <button class="btn-action btn-secondary" id="btnTestMic">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span>THU ÂM THỬ 5 GIÂY (TEST MIC)</span>
        </button>
    </div>

    <!-- Footer Metrics -->
    <div class="footer-metrics">
        <div class="metric-item">
            <span>⚡ LEVEL:</span>
            <span id="valRms" style="color: var(--cyan-glow); font-weight: bold;">0%</span>
        </div>
        <div class="metric-item">
            <span>🔋 WAKE LOCK:</span>
            <span id="valWakeLock" style="color: var(--accent-green);">ON</span>
        </div>
        <div class="metric-item">
            <span>📡 MASTER:</span>
            <span id="valPing" style="color: var(--cyan-glow);">-- ms</span>
        </div>
    </div>

    <script>
        // DOM Elements
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const corePulse = document.getElementById('corePulse');
        const reactorStatus = document.getElementById('reactorStatus');
        const transcriptLabel = document.getElementById('transcriptLabel');
        const transcriptContent = document.getElementById('transcriptContent');
        const btnToggleMic = document.getElementById('btnToggleMic');
        const btnToggleText = document.getElementById('btnToggleText');
        const btnTestMic = document.getElementById('btnTestMic');
        const gainSlider = document.getElementById('gainSlider');
        const gainValue = document.getElementById('gainValue');
        const valRms = document.getElementById('valRms');
        const valWakeLock = document.getElementById('valWakeLock');
        const valPing = document.getElementById('valPing');

        // State variables
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let analyser = null;
        let gainNode = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isMicActive = false;
        let isRecording = false;
        let currentGain = 10.0;
        let animFrameId = null;
        let pingInterval = null;

        // Update Gain Slider
        gainSlider.addEventListener('input', (e) => {
            currentGain = parseFloat(e.target.value);
            gainValue.textContent = `${currentGain}x`;
            if (gainNode) {
                gainNode.gain.value = currentGain;
            }
        });

        // Screen Wake Lock
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                    valWakeLock.textContent = 'ON';
                    valWakeLock.style.color = 'var(--accent-green)';
                }
            } catch (err) {
                valWakeLock.textContent = 'UNSUPPORTED';
            }
        }

        // Initialize WebSocket
        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${location.host}/ws/satellite`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDot.classList.add('active');
                statusLabel.textContent = 'CONNECTED';
                reactorStatus.textContent = isMicActive ? 'SẴN SÀNG' : 'CHỜ BẬT MIC';
                transcriptContent.textContent = 'Đã kết nối với Master AI Hub. Bật mic để nói chuyện.';

                ws.send(JSON.stringify({
                    type: 'register',
                    name: 'Xiaomi Phone Web Satellite'
                }));

                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const start = performance.now();
                        ws.send(JSON.stringify({ type: 'ping', start: start }));
                    }
                }, 4000);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'pong') {
                        const ping = Math.round(performance.now() - (data.start || performance.now()));
                        valPing.textContent = `${ping} ms`;
                    }
                    else if (data.type === 'trigger_test_record') {
                        startTestRecording(data.duration || 5.0);
                    }
                    else if (data.type === 'satellite_test_result') {
                        transcriptLabel.textContent = 'KẾT QUẢ DỊCH GIỌNG NÓI (WHISPER GPU)';
                        transcriptContent.textContent = `"${data.text}"`;
                        reactorStatus.textContent = 'ĐÃ PHÁT QUA LOA';
                    }
                    else if (data.type === 'speaker_status') {
                        if (data.speaking) {
                            reactorStatus.textContent = 'AI ĐANG NÓI';
                            corePulse.style.filter = 'drop-shadow(0 0 30px var(--accent-purple))';
                        } else {
                            reactorStatus.textContent = 'ĐANG LẮNG NGHE';
                            corePulse.style.filter = 'drop-shadow(0 0 20px var(--cyan-glow))';
                        }
                    }
                    else if (data.type === 'result') {
                        transcriptLabel.textContent = 'AI HỒI ĐÁP';
                        transcriptContent.textContent = data.result?.response || 'Đã thực thi thành công.';
                    }
                } catch (e) {
                    console.error('WS parse error:', e);
                }
            };

            ws.onclose = () => {
                statusDot.classList.remove('active');
                statusLabel.textContent = 'DISCONNECTED';
                reactorStatus.textContent = 'MẤT KẾT NỐI';
                valPing.textContent = '-- ms';
                setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = (err) => {
                console.error('WS error:', err);
                ws.close();
            };
        }

        // Real-time Visualizer Loop via AnalyserNode
        function updateVisualizer() {
            if (!analyser || !isMicActive) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < bufferLength; i++) {
                sum += dataArray[i];
            }
            const avg = sum / bufferLength; // 0 to 255
            const levelPct = Math.min(100, Math.round((avg / 128) * 100));

            valRms.textContent = `${levelPct}%`;
            
            // Visual feedback
            const scale = 1.0 + (levelPct / 100) * 1.5;
            corePulse.style.transform = `scale(${scale})`;

            // Broadcast audio level to Master HUD
            if (ws && ws.readyState === WebSocket.OPEN && Math.random() < 0.2) {
                ws.send(JSON.stringify({
                    type: 'audio_level',
                    rms: levelPct / 100.0
                }));
            }

            animFrameId = requestAnimationFrame(updateVisualizer);
        }

        // Start Mic Capture using native Web Audio + MediaRecorder
        async function startMicCapture() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: true
                    }
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                
                // Software Gain Node for sensitivity boost
                gainNode = audioContext.createGain();
                gainNode.gain.value = currentGain;

                // Analyser Node for reactive Arc Reactor
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                source.connect(gainNode);
                gainNode.connect(analyser);

                isMicActive = true;
                btnToggleMic.classList.remove('btn-primary');
                btnToggleMic.classList.add('btn-secondary');
                btnToggleText.textContent = 'TẮT MICROPHONE';
                reactorStatus.textContent = 'ĐANG LẮNG NGHE';
                transcriptLabel.textContent = 'MICROPHONE ĐANG BẬT';
                transcriptContent.textContent = 'Microphone đã kích hoạt! Hãy nói hoặc bấm nút "THU ÂM THỬ 5 GIÂY" để kiểm tra.';

                requestWakeLock();
                updateVisualizer();
            } catch (err) {
                alert('Không thể mở Microphone: ' + err.message);
                console.error(err);
            }
        }

        function stopMicCapture() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
            if (audioContext) audioContext.close();

            isMicActive = false;
            btnToggleMic.classList.add('btn-primary');
            btnToggleMic.classList.remove('btn-secondary');
            btnToggleText.textContent = 'BẬT MICROPHONE (ACTIVATE)';
            reactorStatus.textContent = 'CHƯA BẬT MIC';
            valRms.textContent = '0%';
            corePulse.style.transform = 'scale(1)';
        }

        // Bulletproof MediaRecorder Test Recording (Native Audio Encoding)
        async function startTestRecording(durationSec = 5.0) {
            if (!isMicActive || !mediaStream) {
                await startMicCapture();
            }

            recordedChunks = [];
            
            // Choose supported mimeType
            let mimeType = 'audio/webm';
            if (!MediaRecorder.isTypeSupported('audio/webm')) {
                if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
                else if (MediaRecorder.isTypeSupported('audio/ogg')) mimeType = 'audio/ogg';
                else mimeType = '';
            }

            const options = mimeType ? { mimeType } : {};
            mediaRecorder = new MediaRecorder(mediaStream, options);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Data = reader.result; // data:audio/...;base64,XXXX
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'test_audio_result',
                            audio_b64: base64Data
                        }));
                    }
                };
                reader.readAsDataURL(blob);

                btnTestMic.classList.remove('btn-recording');
                btnTestMic.querySelector('span').textContent = 'THU ÂM THỬ 5 GIÂY (TEST MIC)';
                reactorStatus.textContent = 'ĐANG DỊCH STT...';
                transcriptLabel.textContent = 'GPU FASTER-WHISPER';
                transcriptContent.textContent = 'Đang nhận diện giọng nói & chuẩn bị phát lại qua Loa máy tính...';
            };

            // Start recording
            mediaRecorder.start(100);
            isRecording = true;

            btnTestMic.classList.add('btn-recording');
            btnTestMic.querySelector('span').textContent = `ĐANG THU ÂM (${durationSec}s)...`;
            reactorStatus.textContent = 'ĐANG THU ÂM';
            transcriptLabel.textContent = 'ĐANG THU ÂM THỬ';
            transcriptContent.textContent = `Hãy nói rõ vào điện thoại trong ${durationSec} giây...`;

            // Notify instant wake chime
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'wake_detected' }));
            }

            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
                isRecording = false;
            }, durationSec * 1000);
        }

        // Button Listeners
        btnToggleMic.addEventListener('click', () => {
            if (isMicActive) stopMicCapture();
            else startMicCapture();
        });

        btnTestMic.addEventListener('click', () => {
            startTestRecording(5.0);
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            connectWebSocket();
        });
    </script>
</body>
</html>
