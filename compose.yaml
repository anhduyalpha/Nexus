services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  nexus:
    profiles: [full]
    build: .
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      NEXUS_HOST: '0.0.0.0'
      NEXUS_PORT: '4310'
      NEXUS_DATA_DIR: /data
      NEXUS_REDIS_URL: redis://redis:6379
      NEXUS_TOKEN: ${NEXUS_TOKEN:-}
      NEXUS_ORIGIN: ${NEXUS_ORIGIN:-http://127.0.0.1:4310}
    volumes:
      - nexus-data:/data
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis-data:
  nexus-data:
