name: Bootstrap preview lockfile
on:
  push:
    branches: [feature/nexus-preview]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor == 'anhduyalpha'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@12.4.2
      - run: pnpm install --no-frozen-lockfile
      - name: Commit only the generated lockfile to this feature branch
        run: |
          git config user.name 'Nexus dependency bootstrap'
          git config user.email 'nexus-bootstrap@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: generate preview dependency lockfile'
            git push origin HEAD:refs/heads/feature/nexus-preview
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
